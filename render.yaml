services:
  - type: web
    name: zeus-panel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_PORT
        value: "443"
      - key: ALLOW_CLOUDFLARE_EDGE_IPS
        value: "0"
      - key: RECOVERY_TOKEN
        generateValue: true
